<body>
<a class="skip-link" href="#main" id="skipLink">Skip to content</a>
<div class="app split" id="app">
  <header class="topbar">
    <button class="btn btn-ghost btn-icon menu-btn" id="menuBtn" type="button" aria-label="Open folders" aria-expanded="false" aria-controls="folders"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-menu"/></svg></button>
    <a class="brand" href="#/inbox" aria-label="Inbait, go to Inbox"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-hook"/></svg><span class="brand-text">Inbait</span></a>
    <span class="topbar-title" id="topbarTitle" aria-hidden="true">Inbox</span>
    <div class="search" role="search">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-search"/></svg>
      <label class="visually-hidden" for="search">Search this folder</label>
      <input id="search" type="search" placeholder="Search this folder" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="topbar-actions">
      <button class="score-badge" id="scoreBadge" type="button" aria-label="Hook Score"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-shield"/></svg><span id="scoreText">0%</span></button>
      <div class="seg theme-seg" role="group" aria-label="Theme">
        <button type="button" data-theme-set="system" aria-label="System theme" title="System"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-monitor"/></svg></button>
        <button type="button" data-theme-set="light" aria-label="Light theme" title="Light"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-sun"/></svg></button>
        <button type="button" data-theme-set="dark" aria-label="Dark theme" title="Dark"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-moon"/></svg></button>
      </div>
    </div>
  </header>
  <div class="body">
    <nav class="rail" id="rail" aria-label="Folders, compact"></nav>
    <nav class="folders" id="folders" aria-label="Folders"></nav>
    <main id="main" tabindex="-1">
      <section class="pane-list" id="list" aria-label="List"></section>
      <section class="pane-read" id="reader" aria-label="Reading pane"></section>
    </main>
  </div>
  <nav class="bottomnav" id="bottomnav" aria-label="Main"></nav>
</div>
<div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>
